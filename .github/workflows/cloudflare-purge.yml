# Drop Cloudflare's copy of the site once Vercel has finished deploying.
#
# Publishing in the Studio purges on its own — the Sanity webhook calls
# /api/revalidate/sanity, which purges as part of the same request. A deploy
# publishes nothing in Sanity and still changes every page (new HTML, new asset
# hashes), so it needs this.
#
# NOT inert without its secrets — it fails, on purpose, and an earlier version
# of this comment claimed otherwise. `requireEnv` in scripts/cloudflare/env.mjs
# exits 1 when either is missing, so the run goes red rather than green-and-
# useless. That is the right way round: a purge that silently does not happen
# leaves Cloudflare serving the old page with nothing anywhere saying so.
#
# It is also how this went unnoticed. The workflow ran 23 times over three days,
# failed every time for want of the two secrets, and nobody was watching the
# Actions tab — so the first symptom was a redirect that had shipped hours
# earlier still answering 404 at the edge.
#
# Both secrets live in Settings → Secrets and variables → Actions:
#     CLOUDFLARE_ZONE_ID       Overview → right sidebar, on the zone
#     CLOUDFLARE_PURGE_TOKEN   a token whose ONLY permission is
#                              Zone → Cache Purge → Purge, this zone only
#
# SITE_URL is a repository *variable*, not a secret, and is optional: without it
# the purge still runs, it just cannot print what the edge held before and after.
#
# Two repositories deploy this project (algosbiz/nyuhbali and
# Muthiakartika/nyuh-bali-villa), so both receive `deployment_status` and both
# used to run this — the second one failing every time, for want of secrets it
# has no reason to hold. The job is gated on the repository instead of being
# switched off in one repo's Actions tab: both repos carry this same file, so a
# per-repo toggle is state that lives outside the code and has to be
# rediscovered, while this is visible to whoever reads the workflow next.
#
# WHICH repository was not assumed. algosbiz/nyuhbali is the one whose Vercel
# project serves nyuhbalivillas.com: it is the project that still deploys (the
# other's deployment URLs answer DEPLOYMENT_NOT_FOUND, and it received no
# deployment at all for the most recent commit). **If the domain ever moves to
# the other Vercel project, change this line or the purge silently stops** —
# which is the one failure this gate can cause, so it is worth saying twice.
#
# `deployment_status` is what Vercel's GitHub integration emits; the job skips
# preview deployments, which are not behind Cloudflare.
name: Purge Cloudflare cache

on:
  deployment_status:

jobs:
  purge:
    if: >-
      github.repository == 'algosbiz/nyuhbali' &&
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment_status.environment == 'Production' ||
       github.event.deployment_status.environment == 'production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Purge everything
        run: node scripts/cloudflare/cache.mjs purge
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
